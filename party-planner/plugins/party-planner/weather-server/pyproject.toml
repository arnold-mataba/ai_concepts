[project]
name = "party-weather"
version = "0.1.0"
description = "Kigali weather tools (Open-Meteo), exposed as an MCP server."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.scripts]
party-weather-mcp = "party_weather.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
