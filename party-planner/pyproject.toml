[project]
name = "party-demo"
version = "0.1.0"
description = "Demo: tools, MCP, connectors, skills and plugins, told through rain-checking Kigali celebrations."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "party-weather",
]

[project.scripts]
party-tools = "party_demo.inspect_tools:main"
party-watch = "party_demo.watch_tool_calls:main"
party-calendar-mcp = "party_demo.calendar_server:main"

[tool.uv.sources]
party-weather = { path = "plugins/party-planner/weather-server", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
