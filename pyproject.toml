[project]
name = "rain-check"
version = "0.1.0"
description = "Rain-checking Kigali celebrations, built up one AI concept at a time."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.scripts]
rain-check-mcp = "rain_check.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
